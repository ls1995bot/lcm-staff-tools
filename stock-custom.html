<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ใบเช็คสต็อกเอนกประสงค์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #023f88; --bg: #f4f6f9; --border: #e0e0e0; }
        body { 
            font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; 
            background: var(--bg); color: #333; display: flex; height: 100vh; 
        }

        /* --- Toolbar --- */
        #control-panel {
            width: 280px; padding: 25px; background: white; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10;
        }
        .shop-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .shop-header img { width: 48px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .shop-header h2 { font-size: 18px; margin: 0; color: var(--primary); font-weight: 700; }

        .btn { 
            padding: 12px; border: none; border-radius: 8px; font-family: 'Sarabun'; cursor: pointer; 
            font-weight: 600; transition: all 0.2s; text-align: center; font-size: 14px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; width: 100%;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .btn-add { background: #28a745; color: white; }
        .btn-print { background: var(--primary); color: white; }
        .btn-clear { background: #fff0f0; color: #d32f2f; border: 1px solid #ffcdd2; }
        .btn-back { background: #f5f5f7; color: #333; border: 1px solid #e0e0e0; margin-top: auto; }

        /* --- Preview Area --- */
        #preview-area { flex-grow: 1; padding: 30px; overflow: auto; display: flex; justify-content: center; background: var(--bg); }
        
        .container { 
            max-width: 210mm; background: white; min-height: 297mm; padding: 40px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 2px; position: relative; 
        }

        /* --- Content Style --- */
        .report-header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid var(--primary); padding-bottom: 10px; }
        .report-header h2 { margin: 0; font-size: 24px; color: var(--primary); }
        .report-header p { margin: 10px 0 0; color: #666; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        .editable-title { border: 1px dashed transparent; padding: 2px 5px; border-radius: 4px; display: inline-block; min-width: 50px; }
        .editable-title:hover { border-color: #aaa; background: #f0f7ff; cursor: text; }
        .editable-title:focus { outline: 2px solid var(--primary); background: white; border-color: transparent; }

        .staff-input { border: none; border-bottom: 1px solid #333; font-family: 'Sarabun'; font-size: 14px; width: 200px; text-align: center; background: transparent; }
        .staff-input:focus { outline: none; border-bottom: 2px solid var(--primary); }

        .stock-block { margin-bottom: 30px; border: 1px solid #ddd; padding: 15px; border-radius: 8px; position: relative; transition: 0.2s; background: #fff; }
        .stock-block:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-color: var(--primary); }
        
        .block-actions { position: absolute; top: -12px; right: 10px; display: none; gap: 5px; background: white; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stock-block:hover .block-actions { display: flex; }
        
        .block-btn { padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; background: #fff; font-family: 'Sarabun'; }
        .btn-del-block:hover { background: #d32f2f; color: white; border-color: #d32f2f; }
        .btn-add-col:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .block-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: var(--primary); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #bbb; padding: 8px; vertical-align: middle; position: relative; }
        th { background: #e3f2fd; font-weight: bold; text-align: center; color: var(--primary); }
        
        .cell-input { width: 100%; border: none; background: transparent; padding: 2px; font-family: 'Sarabun'; font-size: 13px; text-align: center; color: #333; }
        .cell-input:focus { outline: none; background: #fff9c4; }
        .cell-left { text-align: left; font-weight: bold; }
        
        .col-remove { position: absolute; top: -8px; right: -5px; color: white; font-size: 10px; cursor: pointer; display: none; background: #dc3545; border-radius: 50%; width: 16px; height: 16px; align-items: center; justify-content: center; }
        th:hover .col-remove { display: flex; }

        .row-action-cell { border: none; background: transparent; width: 30px; text-align: center; opacity: 0; }
        tr:hover .row-action-cell { opacity: 1; }
        .btn-del-row { color: #ccc; cursor: pointer; }
        .btn-del-row:hover { color: #dc3545; }

        .add-row-btn { display: block; width: 100%; padding: 8px; text-align: center; background: #f8f9fa; border: 1px dashed #ccc; border-top: none; cursor: pointer; color: #666; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .add-row-btn:hover { background: #e9ecef; color: var(--primary); }

        @media print {
            body { display: block; background: white; padding: 0; }
            #control-panel, .block-actions, .add-row-btn, .row-action-cell, .col-remove { display: none !important; }
            #preview-area { padding: 0; overflow: visible; display: block; }
            .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; margin: 0; }
            .stock-block { border: none; padding: 0; margin-bottom: 20px; page-break-inside: avoid; }
            input { border: none; }
            th { background-color: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; }
            .report-header { border-bottom: 2px solid #000; }
        }
    </style>
</head>
<body>

<div id="control-panel">
    <div class="shop-header">
        <img src="logo-ls.jpg">
        <div>
            <h2>สร้างแบบฟอร์ม</h2>
            <small>Custom Form</small>
        </div>
    </div>
    
    <button class="btn btn-add" onclick="addTable()"><i class="fas fa-plus-circle"></i> เพิ่มตารางใหม่</button>
    <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> พิมพ์เอกสาร</button>
    <button class="btn btn-clear" onclick="clearAll()"><i class="fas fa-trash"></i> ล้างข้อมูล</button>
    <a href="index.html" class="btn btn-back"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
    
    <div style="margin-top:20px; font-size:12px; color:#666; padding:15px; background:#f8f9fa; border-radius:8px; line-height:1.6;">
        <b><i class="fas fa-info-circle"></i> คำแนะนำ:</b><br>
        1. คลิกที่ <b>ชื่อหมวดหมู่</b> เพื่อแก้ไข<br>
        2. คลิกที่ <b>หัวตาราง</b> เพื่อเปลี่ยนชื่อคอลัมน์<br>
        3. เอาเมาส์ชี้ตารางเพื่อ <b>เพิ่ม/ลบ</b> คอลัมน์
    </div>
</div>

<div id="preview-area">
    <div class="container">
        <div class="report-header">
            <h2 contenteditable="true" class="editable-title" id="docTitle">รายงานตรวจนับสินค้าคงเหลือ</h2>
            <p>
                ประจำวันที่: <span id="currentDate">...</span> | 
                ผู้ตรวจนับ: <input type="text" id="staffName" class="staff-input" placeholder=" ">
            </p>
        </div>
        <div id="tablesContainer"></div>
        
        <div class="no-print" style="text-align:center; padding:40px; color:#aaa; border: 2px dashed #ddd; border-radius:10px; margin-top:20px; cursor:pointer; background:#fafafa;" onclick="addTable()">
            <i class="fas fa-plus-circle" style="font-size:2rem; margin-bottom:10px; color:var(--primary);"></i><br>
            คลิกเพื่อเพิ่มตาราง
        </div>
    </div>
</div>

<script>
    let tablesData = [];
    const KEY = 'customStock_Data';

    function init() {
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
        loadData();
        document.getElementById('staffName').addEventListener('input', saveData);
    }

    function addTable(data = null) {
        const id = Date.now().toString();
        const defaultCols = ["รายการสินค้า", "สี/ลาย", "ขนาด", "จำนวน"];
        const tableObj = data || { id: id, title: "หมวดหมู่: ...", cols: defaultCols, rows: [{}, {}, {}, {}, {}, {}] };
        createTableDOM(tableObj);
        saveData();
    }

    function createTableDOM(data) {
        const container = document.getElementById('tablesContainer');
        const section = document.createElement('div');
        section.className = 'stock-block';
        section.id = `block-${data.id}`;
        
        let colsHTML = '';
        data.cols.forEach((col, idx) => {
            colsHTML += `<th>
                <div class="col-remove no-print" onclick="removeCol('${data.id}', ${idx})"><i class="fas fa-times"></i></div>
                <input type="text" class="cell-input" value="${col}" onchange="updateColName('${data.id}', ${idx}, this.value)" style="font-weight:bold;">
            </th>`;
        });

        let rowsHTML = '';
        data.rows.forEach((row, rIdx) => {
            rowsHTML += createRowHTML(data.id, data.cols.length, row, rIdx);
        });

        section.innerHTML = `
            <div class="block-actions no-print">
                <button class="block-btn btn-add-col" onclick="addCol('${data.id}')"><i class="fas fa-columns"></i> คอลัมน์</button>
                <button class="block-btn btn-del-block" onclick="deleteTable('${data.id}')"><i class="fas fa-trash"></i> ลบ</button>
            </div>
            <div class="block-title">
                <i class="fas fa-caret-right"></i>
                <span contenteditable="true" class="editable-title" onblur="updateTitle('${data.id}', this.innerText)">${data.title}</span>
            </div>
            <table id="tbl-${data.id}">
                <thead><tr id="thead-${data.id}">${colsHTML}<th class="row-action-cell no-print"></th></tr></thead>
                <tbody id="tbody-${data.id}">${rowsHTML}</tbody>
            </table>
            <div class="add-row-btn no-print" onclick="addRow('${data.id}')"><i class="fas fa-plus"></i> เพิ่มรายการ</div>
        `;
        container.appendChild(section);
    }

    function createRowHTML(tableId, colCount, rowData = {}, rowIdx) {
        let cells = '';
        for(let i=0; i<colCount; i++) {
            let val = rowData[i] || '';
            let alignClass = i === 0 ? 'cell-left' : '';
            cells += `<td><input type="text" class="cell-input ${alignClass}" value="${val}" onchange="updateRowData('${tableId}', ${rowIdx}, ${i}, this.value)"></td>`;
        }
        return `<tr id="tr-${tableId}-${rowIdx}">${cells}<td class="row-action-cell no-print"><i class="fas fa-times btn-del-row" onclick="deleteRow('${tableId}', ${rowIdx})"></i></td></tr>`;
    }

    function addRow(tableId) {
        const table = tablesData.find(t => t.id === tableId);
        if(!table) return;
        table.rows.push({});
        saveData();
        const tbody = document.getElementById(`tbody-${tableId}`);
        const newIdx = table.rows.length - 1;
        const newRow = document.createElement('tr');
        newRow.id = `tr-${tableId}-${newIdx}`;
        newRow.innerHTML = createRowHTML(tableId, table.cols.length, {}, newIdx).replace(/^<tr.*?>|<\/tr>$/g, '');
        tbody.appendChild(newRow);
    }

    function deleteRow(tableId, rowIdx) {
        const table = tablesData.find(t => t.id === tableId);
        if(!table) return;
        table.rows.splice(rowIdx, 1);
        saveData();
        refreshTable(tableId); 
    }

    function addCol(tableId) {
        const table = tablesData.find(t => t.id === tableId);
        if(!table) return;
        const colName = prompt("ชื่อคอลัมน์ใหม่:");
        if(colName) {
            table.cols.push(colName);
            saveData();
            refreshTable(tableId);
        }
    }

    function removeCol(tableId, colIdx) {
        const table = tablesData.find(t => t.id === tableId);
        if(!table) return;
        if(confirm(`ลบคอลัมน์ "${table.cols[colIdx]}" ?`)) {
            table.cols.splice(colIdx, 1);
            table.rows = table.rows.map(row => {
                let newR = {}; let c = 0;
                for(let i=0; i<=table.cols.length; i++) { if (i !== colIdx) { if(row[i]) newR[c] = row[i]; c++; } }
                return newR;
            });
            saveData();
            refreshTable(tableId);
        }
    }

    function updateColName(tableId, colIdx, val) { const table = tablesData.find(t => t.id === tableId); if(table) { table.cols[colIdx] = val; saveData(); } }
    function updateTitle(tableId, val) { const table = tablesData.find(t => t.id === tableId); if(table) { table.title = val; saveData(); } }
    function updateRowData(tableId, rowIdx, colIdx, val) { const table = tablesData.find(t => t.id === tableId); if(table) { if(!table.rows[rowIdx]) table.rows[rowIdx] = {}; table.rows[rowIdx][colIdx] = val; saveData(); } }

    function deleteTable(tableId) {
        if(confirm("ต้องการลบตารางนี้?")) {
            tablesData = tablesData.filter(t => t.id !== tableId);
            document.getElementById(`block-${tableId}`).remove();
            saveData();
        }
    }

    function refreshTable(tableId) {
        const table = tablesData.find(t => t.id === tableId);
        document.getElementById(`block-${tableId}`).remove();
        createTableDOM(table);
    }

    function clearAll() {
        if(confirm("ล้างข้อมูลทั้งหมด?")) {
            localStorage.removeItem(KEY);
            location.reload();
        }
    }

    function saveData() {
        const docTitle = document.getElementById('docTitle').innerText;
        const staffName = document.getElementById('staffName').value;
        const payload = { docTitle, staffName, tables: tablesData };
        localStorage.setItem(KEY, JSON.stringify(payload));
    }

    function loadData() {
        const raw = localStorage.getItem(KEY);
        if(raw) {
            const data = JSON.parse(raw);
            document.getElementById('docTitle').innerText = data.docTitle || "รายงานตรวจนับสินค้าคงเหลือ";
            document.getElementById('staffName').value = data.staffName || "";
            if(data.tables && data.tables.length > 0) {
                tablesData = data.tables;
                tablesData.forEach(t => createTableDOM(t));
            } else { addTable(); }
        } else { addTable(); }
    }

    init();
</script>

</body>
</html>
