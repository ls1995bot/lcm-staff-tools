<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สต็อกกระดาษ - แหลมฉบังเครื่องเขียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style id="print-settings">
        @page { size: A4 portrait; margin: 0; }
    </style>
    <style>
        :root { --primary: #023f88; --bg: #f4f6f9; --border: #e0e0e0; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg);
            color: #333;
            display: flex; height: 100vh;
        }

        /* --- Toolbar --- */
        #control-panel {
            width: 280px; padding: 25px; background: white; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10;
        }
        .shop-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .shop-header img { width: 48px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .shop-header h2 { font-size: 18px; margin: 0; color: var(--primary); font-weight: 700; }
        
        .mode-box { background: #f0f4f8; padding: 15px; border-radius: 12px; border: 1px solid #ccdceb; }
        .mode-title { font-weight: bold; color: var(--primary); margin-bottom: 12px; display: block; font-size: 14px; }
        .mode-label { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; margin-bottom: 8px; color: #555; }
        .mode-label:hover { color: var(--primary); }
        
        .btn { 
            padding: 12px; border: none; border-radius: 8px; font-family: 'Sarabun'; cursor: pointer; 
            font-weight: 600; transition: all 0.2s; text-align: center; font-size: 14px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .btn-print { background: var(--primary); color: white; }
        .btn-clear { background: #fff0f0; color: #d32f2f; border: 1px solid #ffcdd2; }
        .btn-back { background: #f5f5f7; color: #333; border: 1px solid #e0e0e0; margin-top: auto; }

        /* --- Preview Area --- */
        #preview-area { flex-grow: 1; padding: 30px; overflow: auto; display: flex; justify-content: center; background: var(--bg); }
        
        .page-sheet {
            background: white; box-sizing: border-box; position: relative; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: none; padding: 5mm; border-radius: 2px;
        }
        .page-sheet.active { display: block; }

        /* ปรับความสูงให้พอดี A4 (297mm) - padding บนล่าง 10mm = เหลือพื้นที่ประมาณ 287mm */
        #page-daily { width: 210mm; height: 296mm; padding: 8mm; } 
        #page-sat { width: 297mm; min-height: 210mm; }

        .grid-daily { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 5px; height: 100%; border: none; }
        .grid-sat { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 5px; height: 100%; border: none; }

        .stock-box { border: 1px solid #000; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
        
        /* Header in Box */
        .box-header { 
            background: #fff; border-bottom: 1px solid #000; padding: 2px 10px; 
            display: flex; align-items: center; justify-content: flex-end; height: 24px; 
        }
        .date-label { font-size: 11px; font-weight: bold; color: #000; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; height: 100%; }
        
        /* ปรับหัวตารางตามสั่ง */
        th { 
            border: 1px solid #666; 
            background: #e0e0e0; /* สีเทาอ่อน */
            color: #000; /* ตัวหนังสือสีดำ */
            text-align: center; 
            font-weight: bold; 
            height: 20px; 
            font-size: 12px; /* ขนาด 12px */
            padding: 0;
        }
        
        td { border: 1px solid #ccc; padding: 0 2px; vertical-align: middle; }

        .col-item { width: 40%; }
        .col-num { width: 7.5%; }

        /* ปรับความสูงบรรทัดให้พอดี A4 */
        #page-daily td { height: auto; font-size: 12px; }
        #page-sat td { height: 19px; font-size: 11px; }

        input.cell { width: 100%; height: 100%; border: none; text-align: center; font-family: 'Sarabun'; font-weight: bold; background: transparent; font-size: inherit; outline: none; }
        .txt-miss { color: #d32f2f; font-weight: bold; text-align: center; }
        .txt-surp { color: #1976d2; font-weight: bold; text-align: center; }
        
        .badge { display: inline-block; width: 10px; height: 10px; border: 1px solid #ccc; margin-right: 4px; border-radius: 50%; vertical-align: middle; }
        .c-yel { background: #FFEB3B; } .c-org { background: #FF9800; } .c-grn { background: #4CAF50; }
        .c-red { background: #F44336; } .c-blu { background: #0046ad; } .c-pnk { background: #FF4081; }
        .c-rbw { background: linear-gradient(135deg, #ff0000, #ffff00, #0000ff); }

        @media print {
            body { display: block; background: white; padding: 0; }
            #control-panel { display: none !important; }
            #preview-area { width: 100%; padding: 0; background: white; overflow: visible; }
            /* Force A4 Size */
            .page-sheet { 
                box-shadow: none; border: none; margin: 0; padding: 5mm; 
                width: 210mm !important; height: 296mm !important; 
                page-break-after: always;
            }
            .grid-daily { gap: 1mm; } /* ระยะห่างตอนพิมพ์ */
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="shop-header">
            <img src="logo-ls.jpg">
            <div>
                <h2>สต็อกกระดาษ</h2>
                <small>แหลมฉบังเครื่องเขียน</small>
            </div>
        </div>
        
        <div class="mode-box">
            <span class="mode-title">เลือกโหมดการเช็ค:</span>
            <label class="mode-label"><input type="radio" name="viewMode" value="daily" checked onchange="switchMode()"> เช็คทุกวัน (6 ชุด/หน้า)</label>
            <label class="mode-label"><input type="radio" name="viewMode" value="sat" onchange="switchMode()"> เช็ควันเสาร์ (4 ชุด/หน้า)</label>
        </div>

        <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> พิมพ์ใบนับสต็อก</button>
        <button class="btn btn-clear" onclick="clearAll()"><i class="fas fa-eraser"></i> ล้างข้อมูล</button>
        <a href="index.html" class="btn btn-back"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
    </div>

    <div id="preview-area">
        <div id="page-daily" class="page-sheet active"><div class="grid-daily" id="daily-container"></div></div>
        <div id="page-sat" class="page-sheet"><div class="grid-sat" id="sat-container"></div></div>
    </div>

    <script>
        const dailyItems = [
            { n: "ดีไลท์", c: "c-yel", p: 5 }, { n: "ควอลิตี้ (ส้ม)", c: "c-org", p: 5 }, { n: "Idea Max", c: "c-org", p: 5 },
            { n: "Idea Green", c: "c-grn", p: 5 }, { n: "Idea Work", c: "c-red", p: 5 }, { n: "Ultimate", c: "c-blu", p: 5 },
            { n: "Double A 80g", c: "c-blu", p: 5 }, { n: "Double A Color", c: "c-rbw", p: 5 }, 
            { n: "A5 ลูกศร", c: "c-red", p: 10 }, { n: "สมุดหัก PS", c: "", p: 10 }, { n: "สมุดหัก ULUX", c: "", p: 10 }
        ];

        const satItems = [
            { n: "ดีไลท์", c: "c-yel", p: 5 }, { n: "ควอลิตี้ (ส้ม)", c: "c-org", p: 5 }, { n: "Idea Max", c: "c-org", p: 5 },
            { n: "Idea Green", c: "c-grn", p: 5 }, { n: "Idea Work", c: "c-red", p: 5 }, { n: "Ultimate", c: "c-blu", p: 5 },
            { n: "Double A 80g", c: "c-blu", p: 5 }, { n: "Double A Color", c: "c-rbw", p: 5 },
            { n: "A5 ขาว (ลูกศร)", c: "c-red", p: 10 }, { n: "A5 ขาว (Arrow)", c: "", p: 10 },
            { n: "A3 Quality 70g", c: "c-yel", p: 5 }, { n: "A3 Idea Work", c: "c-red", p: 5 },
            { n: "A3 Arrow Blue", c: "c-blu", p: 5 }, { n: "A3 Double A", c: "c-blu", p: 5 },
            { n: "F14 80G Quality", c: "c-pnk", p: 5 }, { n: "F14 70G Quality", c: "c-yel", p: 5 },
            { n: "B4 80G Double A", c: "c-blu", p: 5 }, { n: "สมุดหักPS", c: "", p: 10 }, { n: "สมุดหักULUX", c: "", p: 10 }
        ];

        function createTable(id, items) {
            let rows = items.map((item, idx) => {
                let uid = `${id}_${idx}`;
                return `<tr>
                    <td class="col-item" style="text-align:left; font-weight:bold;">${item.c ? `<span class="badge ${item.c}"></span>` : ''}${item.n}</td>
                    <td class="col-num"><input type="number" id="f1r_${uid}" class="cell" oninput="cal('${uid}',${item.p})"></td>
                    <td class="col-num"><input type="number" id="f1b_${uid}" class="cell" oninput="cal('${uid}',${item.p})"></td>
                    <td class="col-num"><input type="number" id="f4r_${uid}" class="cell" oninput="cal('${uid}',${item.p})"></td>
                    <td class="col-num"><input type="number" id="f4b_${uid}" class="cell" oninput="cal('${uid}',${item.p})"></td>
                    <td class="col-num" style="background:#f9f9f9;"><input type="text" id="tot_${uid}" class="cell" readonly></td>
                    <td class="col-num"><input type="number" id="pos_${uid}" class="cell" oninput="cal('${uid}',${item.p})"></td>
                    <td id="miss_${uid}" class="col-num txt-miss" style="text-align:center;"></td>
                    <td id="surp_${uid}" class="col-num txt-surp" style="text-align:center;"></td>
                </tr>`;
            }).join('');

            return `<div class="stock-box">
                <div class="box-header">
                    <span class="date-label">วันที่: _______________________</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2" class="col-item">รายการ</th>
                            <th colspan="2" class="col-num" style="width:15%">ชั้น 1</th>
                            <th colspan="2" class="col-num" style="width:15%">ชั้น 4</th>
                            <th rowspan="2" class="col-num">สรุป</th>
                            <th rowspan="2" class="col-num">คอม</th>
                            <th rowspan="2" class="col-num">ขาด</th>
                            <th rowspan="2" class="col-num">เกิน</th>
                        </tr>
                        <tr>
                            <th style="font-size:10px;">รีม</th><th style="font-size:10px;">ลัง</th>
                            <th style="font-size:10px;">รีม</th><th style="font-size:10px;">ลัง</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }

        function render() {
            let dailyHTML = ''; for(let i=1; i<=6; i++) dailyHTML += createTable(`d${i}`, dailyItems);
            document.getElementById('daily-container').innerHTML = dailyHTML;
            let satHTML = ''; for(let i=1; i<=4; i++) satHTML += createTable(`s${i}`, satItems);
            document.getElementById('sat-container').innerHTML = satHTML;
        }

        window.cal = function(uid, pack) {
            const v = (id) => parseFloat(document.getElementById(id).value) || 0;
            let total = v(`f1r_${uid}`) + (v(`f1b_${uid}`)*pack) + v(`f4r_${uid}`) + (v(`f4b_${uid}`)*pack);
            document.getElementById(`tot_${uid}`).value = total || '';
            let pos = document.getElementById(`pos_${uid}`).value;
            if(pos === '') { document.getElementById(`miss_${uid}`).innerText = ''; document.getElementById(`surp_${uid}`).innerText = ''; return; }
            let diff = total - parseFloat(pos);
            document.getElementById(`miss_${uid}`).innerText = diff < 0 ? Math.abs(diff) : '';
            document.getElementById(`surp_${uid}`).innerText = diff > 0 ? diff : '';
        }

        window.switchMode = function() {
            const mode = document.querySelector('input[name="viewMode"]:checked').value;
            document.querySelectorAll('.page-sheet').forEach(el => el.classList.remove('active'));
            document.getElementById(mode === 'daily' ? 'page-daily' : 'page-sat').classList.add('active');
            document.getElementById('print-settings').innerHTML = mode === 'daily' ? '@page { size: A4 portrait; margin: 0; }' : '@page { size: A4 landscape; margin: 0; }';
        }

        window.clearAll = function() {
            if(confirm('ล้างข้อมูลทั้งหมด?')) {
                document.querySelectorAll('input[type=number], input[type=text]').forEach(el => { if(el.type!=='radio') el.value=''; });
                document.querySelectorAll('.txt-miss, .txt-surp').forEach(el => el.innerText='');
            }
        }
        document.addEventListener('wheel', e => { if(document.activeElement.type === 'number') document.activeElement.blur(); });
        render();
    </script>
</body>
</html>
