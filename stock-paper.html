<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ใบนับสต็อคหมึก - แหลมฉบังเครื่องเขียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #023f88; --bg: #f4f6f9; --border: #e0e0e0; }
        @page { size: A4 landscape; margin: 0; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 0; 
            background: var(--bg); 
            display: flex; height: 100vh; 
            color: #333; font-size: 14px;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* --- Toolbar (Left) --- */
        #control-panel {
            width: 280px; padding: 25px; background: white; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10;
        }
        .shop-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .shop-header img { width: 48px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .shop-header h2 { font-size: 18px; margin: 0; color: var(--primary); font-weight: 700; }
        .shop-header small { color: #666; font-weight: normal; }

        .btn { 
            padding: 12px; border: none; border-radius: 8px; font-family: 'Sarabun'; cursor: pointer; 
            font-weight: 600; transition: all 0.2s; text-align: center; font-size: 14px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn:active { transform: translateY(0); }
        
        .btn-print { background: var(--primary); color: white; }
        .btn-clear { background: #fff0f0; color: #d32f2f; border: 1px solid #ffcdd2; }
        .btn-back { background: #f5f5f7; color: #333; border: 1px solid #e0e0e0; margin-top: auto; }

        /* --- Preview Area (Right) --- */
        #preview-area { flex-grow: 1; padding: 30px; overflow: auto; display: flex; justify-content: center; background: var(--bg); }
        
        .a4-landscape {
            background: white; width: 297mm; height: 210mm; 
            padding: 5mm; box-sizing: border-box; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 2px;
            display: flex; flex-direction: column; overflow: hidden; 
        }

        /* --- Content Style --- */
        .main-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; width: 100%; height: 100%; }
        .day-section { display: flex; flex-direction: column; height: 100%; }
        .day-section:first-child { border-right: 1px dashed #ccc; padding-right: 4mm; }
        .day-section:last-child { padding-left: 4mm; }

        .inner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; flex-grow: 1; }

        .date-line { display: flex; align-items: flex-end; height: 20px; margin-bottom: 5px; font-size: 11px; font-weight: bold; }
        .date-label { white-space: nowrap; margin-right: 5px; }
        .date-underline { border-bottom: 1px solid #000; flex-grow: 1; height: 14px; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { color: #fff; border: 1px solid #666; text-align: center; height: 13px; font-weight: bold; font-size: 9px; padding: 0; background: #0d2e5c; line-height: 13px; }
        td { border: 1px solid #ccc; padding: 0; vertical-align: middle; height: 13px; font-size: 9.5px; white-space: nowrap; overflow: hidden; line-height: 13px; }

        input.cell-input { width: 100%; height: 100%; border: none; outline: none; text-align: center; font-family: 'Sarabun'; font-size: 10px; background: transparent; color: #333; padding: 0; margin: 0; display: block; font-weight: bold; }
        
        .txt-missing { color: #d32f2f; font-weight: bold; text-align: center; }
        .txt-surplus { color: #1976d2; font-weight: bold; text-align: center; }
        .bg-readonly { background: #f5f5f5; color: #555; pointer-events: none; } 

        .brand-row td { font-weight: 800; text-align: center; border: 1px solid #999; font-size: 8px; height: 12px; line-height: 12px; letter-spacing: 0.5px; }
        
        .bg-brother { background: #e3f2fd; color: #0d47a1; }
        .bg-canon { background: #ffebee; color: #b71c1c; }
        .bg-epson { background: #e0f2f1; color: #004d40; }
        .bg-hp { background: #f1f8e9; color: #33691e; }
        .bg-ribbon { background: #fff3e0; color: #e65100; }
        .bg-tape { background: #f3e5f5; color: #4a148c; }
        .bg-sum { background: #eeeeee; color: #333; }

        .badge { display: inline-block; width: 12px; height: 11px; line-height: 11px; text-align: center; font-size: 8px; font-weight: bold; border-radius: 2px; margin-right: 2px; border: 1px solid rgba(0,0,0,0.1); }
        .b-k { background: #222; color: #fff; }    
        .b-c { background: #00B0F0; color: #000; } 
        .b-m { background: #FF00FF; color: #fff; } 
        .b-y { background: #FFFF00; color: #000; } 
        .b-w { background: #fff; color: #000; border:1px solid #ccc; }
        .b-r { background: #d32f2f; color: #fff; }
        .tri-box { display: inline-flex; margin-right: 2px; border: 1px solid #ccc; vertical-align: middle; height: 11px; }
        .tri-box span { width: 4px; height: 100%; display: block; }

        @media print {
            body { display: block; background: white; padding: 0; }
            #control-panel { display: none !important; }
            #preview-area { width: 100%; padding: 0; background: white; overflow: visible; display: block; }
            .a4-landscape { box-shadow: none; border: none; width: 100%; height: 100%; margin: 0; padding: 2mm; }
            .bg-readonly { background: #fff !important; }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <div class="shop-header">
            <img src="logo-ls.jpg">
            <div>
                <h2>นับสต็อคหมึก</h2>
                <small>แหลมฉบังเครื่องเขียน</small>
            </div>
        </div>

        <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> พิมพ์เอกสาร</button>
        <button class="btn btn-clear" onclick="clearData()"><i class="fas fa-eraser"></i> ล้างข้อมูล</button>
        <a href="index.html" class="btn btn-back"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
    </div>

    <div id="preview-area">
        <div class="a4-landscape">
            <div class="main-wrapper">
               <div class="day-section">
                   <div class="date-line">
                       <span class="date-label">วันที่:</span>
                       <div class="date-underline"></div>
                   </div>
                   <div class="inner-grid">
                       <div>
                           <table>
                               <thead><tr><th style="width:38%">รุ่น</th><th style="width:10%">ช.1</th><th style="width:10%">สต็อค</th><th style="width:10%" class="bg-readonly">รวม</th><th style="width:10%">คอม</th><th style="width:11%">ขาด</th><th style="width:11%">เกิน</th></tr></thead>
                                <tbody id="L_col1"></tbody>
                           </table>
                       </div>
                       <div>
                           <table>
                               <thead><tr><th style="width:38%">รุ่น</th><th style="width:10%">ช.1</th><th style="width:10%">สต็อค</th><th style="width:10%" class="bg-readonly">รวม</th><th style="width:10%">คอม</th><th style="width:11%">ขาด</th><th style="width:11%">เกิน</th></tr></thead>
                                <tbody id="L_col2"></tbody>
                           </table>
                       </div>
                   </div>
               </div>

               <div class="day-section">
                   <div class="date-line">
                       <span class="date-label">วันที่:</span>
                       <div class="date-underline"></div>
                   </div>
                   <div class="inner-grid">
                       <div>
                           <table>
                               <thead><tr><th style="width:38%">รุ่น</th><th style="width:10%">ช.1</th><th style="width:10%">สต็อค</th><th style="width:10%" class="bg-readonly">รวม</th><th style="width:10%">คอม</th><th style="width:11%">ขาด</th><th style="width:11%">เกิน</th></tr></thead>
                               <tbody id="R_col1"></tbody>
                           </table>
                       </div>
                       <div>
                           <table>
                               <thead><tr><th style="width:38%">รุ่น</th><th style="width:10%">ช.1</th><th style="width:10%">สต็อค</th><th style="width:10%" class="bg-readonly">รวม</th><th style="width:10%">คอม</th><th style="width:11%">ขาด</th><th style="width:11%">เกิน</th></tr></thead>
                                <tbody id="R_col2"></tbody>
                           </table>
                       </div>
                   </div>
               </div>
           </div>
        </div>
    </div>

    <script>
        const B = '<span class="badge b-k">B</span>';
        const C = '<span class="badge b-c">C</span>';
        const M = '<span class="badge b-m">M</span>';
        const Y = '<span class="badge b-y">Y</span>';
        const W = '<span class="badge b-w">W</span>'; 
        const R = '<span class="badge b-r">R</span>'; 
        const TRI = '<span class="tri-box"><span style="background:#00B0F0"></span><span style="background:#FF00FF"></span><span style="background:#FFFF00"></span></span>';

        const data_col1 = [
            { h: "BROTHER", c: "bg-brother" },
            { n: `${B} D60` }, { n: `${B} 6000` },
            { n: `${C} 5000` }, { n: `${M} 5000` }, { n: `${Y} 5000` },
            { n: `${B} D100` },
            { n: `${C} D100` }, { n: `${M} D100` }, { n: `${Y} D100` },
            { n: `${B} 3619XL` }, { n: `${C} 3619XL` }, { n: `${M} 3619XL` }, { n: `${Y} 3619XL` },
            { n: `${B} 462XL` }, { n: `${C} 462XL` }, { n: `${M} 462XL` }, { n: `${Y} 462XL` },
            { n: "TN1000 (แท้)" }, { n: "DR1000 (แท้)"},
            { n: "TN1000 (เทียบ)" }, { n: "DR1000 (เทียบ)"},
            { h: "CANON", c: "bg-canon" },
            { n: `${B} 47` }, { n: `${TRI} 57` },
            { n: `${B} 740` }, { n: `${TRI} 741` },
            { n: `${B} 745` }, { n: `${TRI} 746` },
            { n: `${B} 810` }, { n: `${TRI} 811` },
            { n: `${B} 88` }, { n: `${TRI} 98` },
            { n: `${B} 71` }, { n: `${C} 71` }, { n: `${M} 71` }, { n: `${Y} 71` },
            { n: `${B} 790` }, { n: `${C} 790` }, { n: `${M} 790` }, { n: `${Y} 790` },
            { h: "BROTHER (TZE TAPE)", c: "bg-tape" },
            { n: `${W} 221 (9 ขาว)` }, { n: `${R} 421 (9 แดง)` }, { n: `${C} 521 (9 ฟ้า)` }, { n: `${Y} 621 (9 หล)` },
            { n: `${W} 231 (12 ขาว)` }, { n: `${R} 431 (12 แดง)` }, { n: `${Y} 631 (12 หล)` },
            { n: `${W} 251 (24 ขาว)` }
        ];

        const data_col2 = [
            { h: "EPSON", c: "bg-epson" },
            { n: `${B} 001` }, { n: `${C} 001` }, { n: `${M} 001` }, { n: `${Y} 001` },
            { n: `${B} 003` }, { n: `${C} 003` }, { n: `${M} 003` }, { n: `${Y} 003` },
            { n: `${B} 008` }, { n: `${C} 008` }, { n: `${M} 008` }, { n: `${Y} 008` },
            { n: `${B} 664` }, { n: `${C} 664` }, { n: `${M} 664` }, { n: `${Y} 664` },
            { n: `${B} 774` },
            { n: "LQ300" }, { n: "LQ310" }, { n: "LQ590" }, 
            { n: "LQ630" }, { n: "LQ2090" }, { n: "LQ2180" },
            { n: "ERC-38 (เทียบ)" },
            { h: "HP", c: "bg-hp" },
            { n: `${B} 678` }, { n: `${TRI} 678` },
            { n: `${B} 680` }, { n: `${TRI} 680` },
            { n: `${B} 682` }, { n: `${TRI} 682` },
            { n: `${B} GT53` }, 
            { n: `${C} GT52` }, { n: `${M} GT52` }, { n: `${Y} GT52` },
            { n: "CF279A (79A)" },
            { n: "W1107A (107A)" },
            { n: "CE285A (85A)" },
            { n: `${B} CE320A` }, { n: `${C} CE321A` }, { n: `${Y} CE322A` }, { n: `${M} CE323A` },
            { h: "เพิ่มเติม", c: "bg-sum" },
            { n: "" }, { n: "" }, { n: "" }, { n: "" }, { n: "" }, { n: "" }
        ];

        function render(data, targetId) {
            let html = "";
            data.forEach((item, idx) => {
                if(item.h) {
                    html += `<tr class="brand-row"><td colspan="7" class="${item.c}">${item.h}</td></tr>`;
                } else {
                    let name = item.n ? item.n : "&nbsp;";
                    let uId = targetId + "_" + idx;
                    html += `
                        <tr>
                            <td style="font-weight:bold; text-align:left; padding-left:4px;">${name}</td>
                            <td><input type="number" id="s1_${uId}" class="cell-input" oninput="calc('${uId}')"></td>
                            <td><input type="number" id="st_${uId}" class="cell-input" oninput="calc('${uId}')"></td>
                            <td class="bg-readonly"><input type="text" id="sum_${uId}" class="cell-input" readonly></td>
                            <td><input type="number" id="pos_${uId}" class="cell-input" oninput="calc('${uId}')"></td>
                            <td><div id="miss_${uId}" class="txt-missing"></div></td>
                            <td><div id="surp_${uId}" class="txt-surplus"></div></td>
                        </tr>
                    `;
                }
            });
            document.getElementById(targetId).innerHTML = html;
        }

        window.calc = function(uid) {
            const s1 = parseFloat(document.getElementById('s1_' + uid).value) || 0;
            const st = parseFloat(document.getElementById('st_' + uid).value) || 0;
            const posEl = document.getElementById('pos_' + uid);
            let total = s1 + st;
            const sumInput = document.getElementById('sum_' + uid);
            sumInput.value = (total > 0) ? total : '';
            if (posEl.value === '') {
                document.getElementById('miss_' + uid).innerText = '';
                document.getElementById('surp_' + uid).innerText = '';
                return;
            }
            let pos = parseFloat(posEl.value) || 0;
            let diff = pos - total;
            const missEl = document.getElementById('miss_' + uid);
            const surpEl = document.getElementById('surp_' + uid);
            missEl.innerText = ''; surpEl.innerText = '';
            if (diff > 0) missEl.innerText = diff;
            else if (diff < 0) surpEl.innerText = Math.abs(diff);
            sumInput.setAttribute('value', sumInput.value);
        }

        document.addEventListener('wheel', function(e) { if (document.activeElement.type === 'number') document.activeElement.blur(); });
        document.addEventListener('keydown', function(e) { if (e.target.type === 'number') { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault(); } });

        function clearData() {
            if(confirm("ล้างข้อมูลตัวเลขทั้งหมด?")) {
                document.querySelectorAll('input[type=number], input[type=text]').forEach(i => { if(!i.readOnly) i.value = ''; });
                document.querySelectorAll('[id^="sum_"]').forEach(i => i.value = '');
                document.querySelectorAll('[id^="miss_"], [id^="surp_"]').forEach(d => d.innerText = '');
            }
        }

        render(data_col1, 'L_col1'); render(data_col2, 'L_col2');
        render(data_col1, 'R_col1'); render(data_col2, 'R_col2');
    </script>
</body>
</html>
