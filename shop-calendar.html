        .d-num { display: block; font-size: 16px; font-weight: 800; color: #333; line-height: 1; }

        .ev-impact { font-size: 11px; color: #d35400; margin-top: 3px; display: flex; align-items: center; gap: 4px; font-weight: 500; }

        .tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; color: white; font-weight: 600; }

                {d:"31", t:"วันฮาโลวีน", ty:"--c-fes", im:"งานเลี้ยง"}
            ],
            sell: ["หน้ากากผี", "สีเพนท์หน้า", "ธง ภปร./ร.9", "อุปกรณ์ สนง."]
        },
        {   // NOV
            ev: [
                {d:"1", t:"เปิดเทอม 2", ty:"--c-fes", im:"ซื้อสมุด/ปากกา"},
                {d:"12-21", t:"ลงทะเบียน ม.เกษตร", ty:"--c-ku", im:""},
                {d:"24", t:"วันลอยกระทง", ty:"--c-fes", im:"ทำกระทง"},
                {d:"25", t:"วันวชิราวุธ", ty:"--c-fes", im:"พิธีลูกเสือ"}
            ],
            sell: ["อุปกรณ์ลูกเสือ", "วัสดุทำกระทง", "สมุด/ปากกา", "สีสเปรย์"]
        },
        {   // DEC
            ev: [
                {d:"5", t:"วันพ่อแห่งชาติ", ty:"--c-hol", im:"หยุดราชการ"},
                {d:"10", t:"วันรัฐธรรมนูญ", ty:"--c-hol", im:"หยุดราชการ"},
                {d:"14-16", t:"สอบ TGAT/TPAT", ty:"--c-fes", im:"เด็ก ม.6 สอบ"},
                {d:"25", t:"วันคริสต์มาส", ty:"--c-fes", im:"จับฉลาก"},
                {d:"31", t:"วันสิ้นปี", ty:"--c-hol", im:"หยุดราชการ"}
            ],
            sell: ["กระดาษห่อของขวัญ", "ริบบิ้น/โบว์", "ดินสอ 2B", "ไดอารี่ 2570"]
        }
    ];

    function init() {
        renderNav();
        const today = new Date();
        document.getElementById('todayDate').innerText = today.toLocaleDateString('th-TH', { dateStyle: 'long' });
        selectMonth(today.getMonth());
        renderTimeline();
    }

    function renderNav() {
        const nav = document.getElementById('monthNav');
        let html = '';
        monthNames.forEach((m, i) => {
            html += `<button class="month-btn" onclick="selectMonth(${i})" id="btn-${i}">${m}</button>`;
        });
        nav.innerHTML = html;
    }

    function selectMonth(idx) {
        document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${idx}`).classList.add('active');
        document.getElementById(`btn-${idx}`).scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });

        const nextIdx = (idx + 1) % 12;
        document.getElementById('dualView').innerHTML = 
            renderCard(idx, "เดือนนี้ (Current)", "tag-curr") + 
            renderCard(nextIdx, "เดือนหน้า (Next)", "tag-next");
    }

    function renderCard(idx, title, tagClass) {
        const d = data[idx];
        const rows = d.ev.map(e => `
            <div class="event-item">
                <div class="ev-date ${e.ty === '--c-hol' ? 'hol' : ''}" style="${e.ty !== '--c-hol' && e.ty !== '--c-fes' ? '' : ''}">
                    <span class="d-num">${e.d.split('-')[0]}</span>
                    <span class="d-lbl">วันที่</span>
                </div>
                <div class="ev-info">
                    <div class="ev-name">${e.t}</div>
                    <div class="badges">
                        <span class="tag" style="background:var(${e.ty})">${getLabel(e.ty)}</span>
                        ${e.im ? `<span class="ev-impact"><i class="fas fa-comment-dollar"></i> ${e.im}</span>` : ''}
                    </div>
                </div>
            </div>
        `).join('');

        const preps = d.sell.map(p => `
            <div class="prep-item"><i class="fas fa-box-open"></i> ${p}</div>
        `).join('');

        return `
            <div class="month-card">
                <div class="mc-header">
                    <div class="mc-title">${monthNames[idx]} 2569</div>
                    <div class="mc-tag ${tagClass}">${title}</div>
                </div>
                <div class="mc-body">${rows}</div>
                <div class="mc-footer">
                    <div class="prep-head"><i class="fas fa-star"></i> เน้นขาย / ต้องมี</div>
                    <div class="prep-grid">${preps}</div>
                </div>
            </div>
        `;
    }

    function getLabel(v) {
        const map = {
            '--c-acs':'อัสสัมฯ', '--c-boonjit':'บุญจิต', '--c-srisu':'ศรีสุวิช',
            '--c-dara':'ดาราฯ', '--c-muni':'เทศบาล', '--c-ku':'ม.เกษตร',
            '--c-src':'ศรีราชา', '--c-hol':'วันหยุด', '--c-fes':'สำคัญ', '--c-gen':'ทั่วไป', '--c-shop':'ร้าน'
        };
        return map[v] || 'ทั่วไป';
    }

    function renderTimeline() {
        let html = '';
        monthNames.forEach((m, i) => {
            const preview = data[i].ev.slice(0, 2).map(e => e.t.split('(')[0]).join(', ');
            html += `
                <div class="tl-row" onclick="selectMonth(${i})">
                    <div class="tl-m">${m}</div>
                    <div class="tl-d">${preview}...</div>
                </div>
            `;
        });
        document.getElementById('yearTimeline').innerHTML = html;
    }

    init();
</script>

</body>
</html>
