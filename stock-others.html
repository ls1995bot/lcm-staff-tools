    <style>
        :root { --primary: #023f88; --bg: #f4f6f9; --border: #999; }
        @page { size: A4 portrait; margin: 0; } 
        
        body {

            margin: 0; padding: 0; 
            background: var(--bg); 
            color: #000;
            display: flex;
            height: 100vh;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* --- Toolbar --- */
        #control-panel {
            width: 340px; padding: 20px; background: white; border-right: 1px solid #ccc;
            display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0;
        }
        .shop-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .shop-header img { width: 45px; border-radius: 50%; }
        .shop-header h2 { font-size: 18px; margin: 0; color: var(--primary); }
        
        .selector-box { border: 1px solid #ddd; border-radius: 6px; padding: 10px; background: #fff; }
        .selector-title { font-weight: bold; margin-bottom: 8px; font-size: 14px; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 2px; }
        .checkbox-item:hover { background: #f0f7ff; }
        .checkbox-item input { transform: scale(1.3); }

        .btn { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; font-size: 14px; margin-top: 5px; font-family: 'Sarabun'; }
        .btn-gen { background: #28a745; color: white; }
        .btn-print { background: var(--primary); color: white; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; display: block; box-sizing: border-box;}

        /* --- Preview Area --- */
        #preview-area { flex-grow: 1; padding: 20px; overflow: auto; display: flex; justify-content: center; background: #555; }
        
        .a4-page {
            background: white; width: 210mm; min-height: 297mm; 
            padding: 10mm; box-sizing: border-box; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            margin-bottom: 20px; position: relative;
        }

        /* --- Document Design --- */
        .doc-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 15px;
        }
        .doc-title { font-size: 24px; font-weight: 800; color: #000; }
        .doc-info { font-size: 14px; font-weight: bold; text-align: right; line-height: 1.8; }
        .doc-line { border-bottom: 1px dotted #000; display: inline-block; width: 120px; text-align: center; }

        /* Table Layout */
        .print-grid { display: block; }

        .category-block { 
            border: 2px solid #000; margin-bottom: 15px; 
            break-inside: avoid; background: #fff;
        }
        .cat-header { 
            background: #ddd; color: #000; padding: 6px 10px; 
            font-weight: 800; font-size: 16px; border-bottom: 2px solid #000;
        }
        
        /* Inner Table */
        .stock-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .stock-table th { 
            border-bottom: 1px solid #000; border-right: 1px solid #000; 
            padding: 4px; text-align: center; background: #f0f0f0; font-weight: bold;
        }
        .stock-table td { 
            border-bottom: 1px solid #ccc; border-right: 1px solid #000; 
            padding: 4px; vertical-align: middle; height: 24px;
        }
        .stock-table tr:last-child td { border-bottom: none; }
        
        .col-code { width: 90px; font-family: monospace; font-weight: bold; text-align: center; color: #444; font-size: 12px; }
        .col-name { font-weight: 600; padding-left: 8px !important; }
        .col-input { width: 50px; text-align: center; border-left: 1px solid #000; }
        .col-total { width: 50px; background: #f9f9f9; font-weight: bold; }

        /* Color Circle */
        .color-dot {
            display: inline-block; width: 16px; height: 16px; border-radius: 50%; 
            border: 1px solid #999; margin-right: 8px; vertical-align: middle;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Input Mockup for Print */
        .input-box { width: 100%; height: 100%; border: none; text-align: center; font-size: 14px; color: #000; font-weight: bold; font-family: 'Sarabun'; }

        @media print {
            body { display: block; background: white; padding: 0; }
            #control-panel { display: none !important; }
            #preview-area { padding: 0; background: white; overflow: visible; display: block; }
            .a4-page { box-shadow: none; margin: 0; page-break-after: always; width: 100%; height: auto; padding: 0; }
            .a4-page:last-child { page-break-after: auto; }
            .stock-table th { background-color: #ddd !important; -webkit-print-color-adjust: exact; }
            input { border: none !important; }
        }
    </style>
</head>

    function generateSheet() {
        const checkboxes = document.querySelectorAll('input[name="cat"]:checked');
        const container = document.getElementById('sheet-content');
        container.innerHTML = '';

        if (checkboxes.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#999; padding:50px; font-size:16px;">กรุณาติ๊กเลือกหมวดหมู่ที่ต้องการ</div>';
            return;
        }

        checkboxes.forEach(chk => {
            const key = chk.value;
            const data = db[key];
            if (data) renderBlock(data, container);
        });
    }

    function renderBlock(data, container) {
        let rowsHtml = '';
        data.items.forEach(item => {
            // สร้างวงกลมสี ถ้ามี key สี
            const colorDot = item.k ? `<span class="color-dot" style="background:${colors[item.k]||'#fff'}"></span>` : '';
            
            rowsHtml += `
                <tr>
                    <td class="col-code">${item.c}</td>
                    <td class="col-name">${colorDot}${item.n}</td>
                    <td class="col-input"><input class="input-box" type="text"></td>
                    <td class="col-input"><input class="input-box" type="text"></td>
                    <td class="col-input col-total"><input class="input-box" type="text"></td>
                </tr>
            `;
        });

        const html = `
            <div class="category-block">
                <div class="cat-header">${data.title}</div>
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th style="width:15%">รหัส</th>
                            <th style="width:40%">รายการ</th>
                            <th style="width:15%">หน้าร้าน</th>
                            <th style="width:15%">สโตร์</th>
                            <th style="width:15%">รวม</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    }
</script>
