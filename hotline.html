<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Reference - LCM</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --apple-canvas: #ffffff;
            --apple-gray: #f5f5f7;
            --apple-text: #1d1d1f;
            --apple-sub: #86868b;
            --ls-blue: #0071e3;
            --sk-pink: #ff3b30;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Sarabun', -apple-system, sans-serif;
            background-color: var(--apple-canvas);
            margin: 0; padding: 0;
            color: var(--apple-text);
            -webkit-font-smoothing: antialiased;
        }

        nav {
            position: sticky; top: 0; z-index: 9999;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            height: 44px; display: flex; align-items: center;
        }
        .nav-content {
            width: 100%; max-width: 1024px; margin: 0 auto;
            padding: 0 22px; color: #f5f5f7;
            font-size: 13px; font-weight: 300;
            display: flex; justify-content: space-between;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .header h1 {
            font-size: 32px; font-weight: 700; margin: 0;
            letter-spacing: -0.02em; text-align: center;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            background: var(--apple-gray);
            font-size: 17px;
            margin-top: 25px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Sarabun';
        }

        /* Category Header */
        .section-header {
            margin: 40px 0 15px;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Info Card */
        .info-card {
            background: var(--apple-gray);
            padding: 20px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.3s var(--ease);
        }

        .info-card:active { transform: scale(0.98); }

        .info-label { font-size: 18px; font-weight: 700; color: var(--apple-text); }
        .info-note { font-size: 14px; color: var(--apple-sub); margin-top: 2px; line-height: 1.3; }
        .info-value { font-size: 15px; color: var(--ls-blue); font-weight: 500; margin-top: 4px; }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; }
        .action-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-call { background: #34c759; color: white; }
        .btn-copy { background: #e5e5ea; color: var(--apple-text); }

        /* Floating Home Button */
        .fab-home {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: var(--apple-text);
            color: white; padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600; font-size: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <span>แหลมฉบังเครื่องเขียน (1995)</span>
            <span style="font-weight: 600;">Emergency Hub</span>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>ข้อมูลสำคัญ</h1>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 ค้นหาปัญหา เช่น 'ไฟไหม้', 'น้ำรั่ว'...">
        </div>

        <div id="contentArea"></div>
    </div>

    <a href="index.html" class="fab-home"><i class="fas fa-home"></i> กลับหน้าหลัก</a>

<script>
const database = [
    {
        category: "🚨 ฉุกเฉิน & ความปลอดภัย",
        icon: "fa-shield-alt",
        color: "#ff3b30",
        items: [
            { label: "กู้ภัยสว่างประทีป", value: "038-311-152", note: "รถพยาบาลด่วน / มีสัตว์พิษ / จับงู / อุบัติเหตุหน้าร้าน" },
            { label: "ดับเพลิงแหลมฉบัง", value: "038-400-808", note: "แจ้งเหตุไฟไหม้ / มีกลิ่นไหม้ผิดปกติ" },
            { label: "สภ.แหลมฉบัง", value: "038-490-555", note: "โดนขโมยของ / มิจฉาชีพเข้าร้าน / แจ้งความ" },
            { label: "รพ. วิภาราม", value: "033-009-888", note: "เจ็บป่วยฉุกเฉิน (พิกัดใกล้ร้านที่สุด)" }
        ]
    },
    {
        category: "🏢 ระบบอาคาร & น้ำไฟ",
        icon: "fa-building",
        color: "#ff9500",
        items: [
            { label: "ไฟฟ้า (กฟภ.)", value: "038-182-565", note: "ไฟดับทั้งร้าน / หม้อแปลงระเบิด / สายไฟไหม้" },
            { label: "ประปา (กปภ.)", value: "038-350-447", note: "ท่อน้ำแตก / น้ำไม่ไหล / มิเตอร์น้ำมีปัญหา" }
        ]
    },
    {
        category: "🛠️ บริการช่างซ่อมบำรุง",
        icon: "fa-wrench",
        color: "#0071e3",
        items: [
            { label: "ช่างแอร์", value: "081-654-2065", note: "แอร์ไม่เย็น / น้ำหยด / เสียงดังผิดปกติ" },
            { label: "ช่างประตูม้วน", value: "086-138-0004", note: "ประตูค้าง / เปิด-ปิดร้านไม่ได้" },
            { label: "ช่างกระจก", value: "081-344-3079", note: "กระจกแตก / ประตูฝืด / โดนทุบกระจก" },
            { label: "HomePro Service", value: "1284", note: "ช่างสำรอง: น้ำรั่ว/ไฟช็อต/งานซ่อมทั่วไป (ถ้าตามช่างปกติไม่ได้)" }
        ]
    }
];

function render(filter = "") {
    const container = document.getElementById("contentArea");
    container.innerHTML = "";
    const text = filter.toLowerCase();

    database.forEach(group => {
        const filteredItems = group.items.filter(i => 
            i.label.toLowerCase().includes(text) || 
            i.note.toLowerCase().includes(text) || 
            i.value.toLowerCase().includes(text)
        );

        if (filteredItems.length > 0) {
            const header = document.createElement("div");
            header.className = "section-header";
            header.style.color = group.color;
            header.innerHTML = `<i class="fas ${group.icon}"></i> ${group.category}`;
            container.appendChild(header);

            filteredItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "info-card";
                card.innerHTML = `
                    <div style="flex: 1; padding-right: 15px;">
                        <div class="info-label">${item.label}</div>
                        <div class="info-note">${item.note}</div>
                        <div class="info-value">${item.value}</div>
                    </div>
                    <div class="btn-group">
                        <a href="tel:${item.value}" class="action-btn btn-call"><i class="fas fa-phone"></i></a>
                        <button class="action-btn btn-copy" onclick="copyText('${item.value}')"><i class="fas fa-copy"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    });
}

function copyText(text) {
    navigator.clipboard.writeText(text);
    const toast = document.createElement('div');
    toast.innerText = "คัดลอกเบอร์แล้ว";
    toast.style.cssText = "position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:10px 20px; border-radius:20px; font-size:14px; z-index:2000;";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1500);
}

document.getElementById("searchInput").addEventListener("input", e => render(e.target.value));
render();
</script>
</body>
</html>
