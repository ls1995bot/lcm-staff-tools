<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS PORTAL - Smart Uniform System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        .checklist-item:checked + label { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-blue-700 rounded-t-xl p-6 text-white shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold"><i class="fa-solid fa-shirt mr-2"></i> ระบบจัดชุดและงานปัก</h1>
            <p class="text-blue-200 mt-1">LS PORTAL - Smart Uniform System</p>
        </div>
        <button onclick="toggleModal('alacarte-modal')" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 font-semibold py-2 px-4 rounded-lg shadow transition">
            <i class="fa-solid fa-tags"></i> เมนูงานเลาะ/จิปาถะ
        </button>
    </div>

    <div class="max-w-5xl mx-auto bg-white p-6 shadow-md border-b">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">โรงเรียน</label>
                <select id="filter-school" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- เลือกโรงเรียน --</option>
                    <option value="เทศบาลแหลมฉบัง 1">เทศบาลแหลมฉบัง 1</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ระดับชั้น</label>
                <select id="filter-level" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- เลือกระดับชั้น --</option>
                    <option value="ป.1-6">ป.1-6</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เพศ</label>
                <select id="filter-gender" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- เลือกเพศ --</option>
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง">หญิง</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทชุด</label>
                <select id="filter-type" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">-- เลือกชุด --</option>
                    <option value="ชุดนักเรียน">ชุดนักเรียน</option>
                </select>
            </div>
        </div>
        <div class="mt-4 flex justify-end">
            <button onclick="searchUniform()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md shadow flex items-center">
                <i class="fa-solid fa-magnifying-glass mr-2"></i> ค้นหาโพยจัดของ
            </button>
        </div>
    </div>

    <div id="results-section" class="max-w-5xl mx-auto mt-6 hidden">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-white rounded-xl shadow-md p-6 border-t-4 border-green-500">
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-clipboard-check text-green-500 mr-2"></i> โพยหยิบสินค้า (Checklist)</h2>
                <div id="checklist-container" class="space-y-3">
                    </div>
            </div>

            <div class="bg-white rounded-xl shadow-md p-6 border-t-4 border-blue-500 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-bl-lg">ข้อมูลงานปัก</div>
                <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-wand-magic-sparkles text-blue-500 mr-2"></i> กฎการปักเสื้อ</h2>
                
                <div class="space-y-4" id="embroidery-container">
                    </div>
            </div>

        </div>
    </div>

    <div id="alacarte-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-tags text-yellow-500 mr-2"></i> เมนูงานบริการเสริม (A La Carte)</h2>
                <button onclick="toggleModal('alacarte-modal')" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600">
                            <th class="p-2 border-b">หมวดหมู่</th>
                            <th class="p-2 border-b">ชื่อบริการ</th>
                            <th class="p-2 border-b">ราคา (บาท)</th>
                            <th class="p-2 border-b">หมายเหตุ</th>
                        </tr>
                    </thead>
                    <tbody id="alacarte-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. จำลองฐานข้อมูลจากไฟล์ CSV ของคุณ J (ใช้แถวแรกเป็นตัวอย่าง)
        const mockDatabase = [
            {
                "School": "เทศบาลแหลมฉบัง 1",
                "Level": "ป.1-6",
                "Gender": "ชาย",
                "UniformType": "ชุดนักเรียน",
                "Top": "เสื้อเชิ้ต นร.ชาย",
                "Bottom": "กางเกงกากี",
                "Acc1": "เข็มขัดนักเรียน สีน้ำตาล",
                "Acc2": "รองเท้านักเรียน สีน้ำตาล",
                "Acc3": "ถุงเท้านักเรียน ไนล่อน สีน้ำตาล",
                "Acc4": "",
                "Emb_Detail": "ชื่อ ร.ร. (ขวา) + ชื่อน.ร. (ซ้าย) + จุดตามระดับชั้น (ซ้ายเหนือชื่อ)",
                "Emb_Color": "น้ำเงิน",
                "Emb_Position": "อกซ้าย-ขวา",
                "Emb_BasePrice": "60",
                "Emb_Extra_Rules": "ป.1 จุด 1 จุด, ป.2 จุด 2 จุด..."
            }
        ];

        // 2. จำลองฐานข้อมูลงานบริการเสริม
        const mockServices = [
            { Category: "งานเลาะ", ServiceName: "เลาะชื่อ-สกุล", Price: "30", Note: "" },
            { Category: "งานเลาะ", ServiceName: "เลาะชือ รร. /ชั้น /รหัส", Price: "30", Note: "" },
            { Category: "งานเลาะ", ServiceName: "เลาะดาว 3 ดวง", Price: "10", Note: "" },
            { Category: "งานเลาะ", ServiceName: "เลาะกระเป๋า", Price: "15", Note: "" },
            { Category: "งานปักเพิ่ม", ServiceName: "ปัก ดาว 1 ดวง", Price: "10", Note: "" },
            { Category: "งานปักเพิ่ม", ServiceName: "ปัก ชั้นเรียน / รหัส นร.", Price: "20", Note: "" },
            { Category: "งานปักเพิ่ม", ServiceName: "ปัก ชื่อ รร.", Price: "30", Note: "" },
            { Category: "งานเย็บ", ServiceName: "ค่าเย็บกระเป๋าปัก", Price: "20", Note: "" },
            { Category: "งานเย็บ", ServiceName: "ค่าเย็บเครื่องหมาย (ต่อชิ้น)", Price: "10", Note: "" }
        ];

        // ฟังก์ชันโหลดข้อมูล A La Carte ลงตารางตอนเปิดเว็บ
        function loadServices() {
            const tbody = document.getElementById('alacarte-table-body');
            mockServices.forEach(item => {
                let badgeColor = item.Category === 'งานเลาะ' ? 'bg-red-100 text-red-700' : 
                                 item.Category === 'งานเย็บ' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700';
                
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2"><span class="px-2 py-1 text-xs rounded-full font-medium ${badgeColor}">${item.Category}</span></td>
                        <td class="p-2 text-gray-800 font-medium">${item.ServiceName}</td>
                        <td class="p-2 text-blue-600 font-bold">${item.Price}</td>
                        <td class="p-2 text-sm text-gray-500">${item.Note}</td>
                    </tr>
                `;
            });
        }

        // ฟังก์ชันเปิด-ปิด Modal
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        // ฟังก์ชันหลักตอนกดปุ่มค้นหา
        function searchUniform() {
            // ดึงค่าจาก Dropdown
            const school = document.getElementById('filter-school').value;
            const level = document.getElementById('filter-level').value;
            const gender = document.getElementById('filter-gender').value;
            const type = document.getElementById('filter-type').value;

            if(!school || !level || !gender || !type) {
                alert("กรุณาเลือกตัวกรองให้ครบถ้วนก่อนค้นหานะครับ!");
                return;
            }

            // ค้นหาข้อมูลใน Database จำลอง
            const result = mockDatabase.find(r => r.School === school && r.Level === level && r.Gender === gender && r.UniformType === type);

            if(result) {
                renderChecklist(result);
                renderEmbroidery(result);
                document.getElementById('results-section').classList.remove('hidden');
            } else {
                alert("ไม่พบข้อมูลกฎของโรงเรียนนี้ในระบบครับ ลองเลือกเป็น 'ชาย' ดูนะครับ (เพราะเราทำข้อมูลตัวอย่างไว้แค่นั้น)");
            }
        }

        // ฟังก์ชันวาด Checklist (ดึงเฉพาะคอลัมน์ที่มีข้อมูล)
        function renderChecklist(data) {
            const container = document.getElementById('checklist-container');
            container.innerHTML = ''; // ล้างของเก่า

            const itemsToPick = [];
            if(data.Top) itemsToPick.push({ icon: 'fa-shirt', name: data.Top });
            if(data.Bottom) itemsToPick.push({ icon: 'fa-socks', name: data.Bottom }); // ไอคอนกางเกง
            for(let i=1; i<=10; i++) {
                if(data[`Acc${i}`]) itemsToPick.push({ icon: 'fa-star', name: data[`Acc${i}`] });
            }

            itemsToPick.forEach((item, index) => {
                container.innerHTML += `
                    <div class="flex items-center p-3 bg-gray-50 hover:bg-gray-100 rounded-lg border border-gray-100 transition">
                        <input type="checkbox" id="item-${index}" class="checklist-item w-5 h-5 text-green-600 rounded border-gray-300 focus:ring-green-500 cursor-pointer">
                        <label for="item-${index}" class="ml-3 text-gray-700 font-medium cursor-pointer w-full flex items-center">
                            <i class="fa-solid ${item.icon} text-gray-400 mr-3 w-5 text-center"></i>
                            ${item.name}
                        </label>
                    </div>
                `;
            });
        }

        // ฟังก์ชันวาดข้อมูลงานปัก
        function renderEmbroidery(data) {
            const container = document.getElementById('embroidery-container');
            container.innerHTML = `
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1 bg-blue-50 p-4 rounded-lg border border-blue-100">
                        <p class="text-sm text-blue-600 mb-1 font-medium">รูปแบบการปัก</p>
                        <p class="text-gray-800 font-semibold">${data.Emb_Detail}</p>
                    </div>
                    <div class="flex-1 bg-yellow-50 p-4 rounded-lg border border-yellow-100">
                        <p class="text-sm text-yellow-600 mb-1 font-medium">ราคาเริ่มต้น</p>
                        <p class="text-2xl font-bold text-gray-800">${data.Emb_BasePrice} <span class="text-sm font-normal text-gray-600">บาท</span></p>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mt-2">
                    <div class="p-3 border rounded-lg">
                        <p class="text-xs text-gray-500 mb-1"><i class="fa-solid fa-palette"></i> สีด้าย</p>
                        <p class="font-medium text-gray-800">${data.Emb_Color}</p>
                    </div>
                    <div class="p-3 border rounded-lg">
                        <p class="text-xs text-gray-500 mb-1"><i class="fa-solid fa-location-crosshairs"></i> ตำแหน่ง</p>
                        <p class="font-medium text-gray-800">${data.Emb_Position}</p>
                    </div>
                </div>

                <div class="mt-2 p-3 bg-red-50 border border-red-100 rounded-lg">
                    <p class="text-xs text-red-600 mb-1 font-bold"><i class="fa-solid fa-circle-exclamation"></i> กฎพิเศษ / ข้อควรระวัง!</p>
                    <p class="font-medium text-red-800">${data.Emb_Extra_Rules}</p>
                </div>
            `;
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        window.onload = loadServices;
    </script>
</body>
</html>
