<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - สรุปยอดขาย</title>
    <link rel="icon" href="logo-ls.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { 
            --bg: #f4f6f9; 
            --ls: #023f88; --ls-light: #e6f0ff;
            --sk: #ff0588; --sk-light: #fff0f6;
            --sb: #e67e22; --sb-light: #fff5eb;
            --pos: #28a745; --neg: #dc3545; --warn: #ffc107;
            --purple: #673ab7;
        }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }

        /* Login Overlay */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            backdrop-filter: blur(5px);
        }
        .login-box { background: white; padding: 30px; border-radius: 16px; text-align: center; width: 280px; }
        .login-box input { width: 100%; padding: 15px; font-size: 24px; text-align: center; border: 2px solid #eee; border-radius: 8px; margin: 15px 0; letter-spacing: 5px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h2 { margin: 0; font-size: 24px; font-weight: 800; color: #333; }
        .btn-back { text-decoration: none; background: #666; color: white; padding: 8px 15px; border-radius: 20px; font-size: 14px; }

        /* Filter Bar */
        .filters { background: white; padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; flex-wrap: wrap; }
        .filters select, .filters input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Sarabun'; font-size: 1rem; flex-grow: 1; }
        .btn-load { background: #0071e3; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; flex-shrink: 0; }

        /* Dashboard Grid */
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; display: flex; flex-direction: column; }
        .card-head { padding: 15px; font-weight: 800; color: white; font-size: 18px; display: flex; justify-content: space-between; }
        .card-body { padding: 15px; }
        
        .c-ls { border-top: 5px solid var(--ls); } .c-ls .card-head { background: var(--ls); }
        .c-sk { border-top: 5px solid var(--sk); } .c-sk .card-head { background: var(--sk); }
        .c-sb { border-top: 5px solid var(--sb); } .c-sb .card-head { background: var(--sb); }

        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .stat-val { font-weight: bold; font-size: 16px; }

        /* Audit Box */
        .audit-card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 5px solid var(--warn); }
        .audit-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        .audit-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .audit-bad { color: var(--neg); font-weight: bold; }
        .audit-good { color: var(--warn); font-weight: bold; }

        /* Grand Total */
        .grand-box { background: #333; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        
        /* Table */
        .table-card { background: white; border-radius: 16px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 10px; background: #f8f9fa; font-size: 13px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        .badge { padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; color: white; display: inline-block; width: 50px; text-align: center; }
        .b-ls { background: var(--ls); } .b-sk { background: var(--sk); } .b-sb { background: var(--sb); }

        /* 📸 Save Image Button (Updated) */
        .btn-img-save { 
            position: fixed; bottom: 20px; right: 20px; 
            background: var(--purple); color: white; border: none; 
            padding: 15px 25px; border-radius: 30px; font-weight: bold; 
            font-size: 16px; cursor: pointer; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); 
            display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 99; 
        }
        .btn-img-save:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <div style="font-size:40px; margin-bottom:10px;">🔒</div>
        <h3>ใส่รหัสผ่านผู้บริหาร</h3>
        <input type="password" id="passInput" inputmode="numeric" placeholder="PIN">
        <button class="btn-login" onclick="checkPass()">เข้าสู่ระบบ</button>
        <div id="loginMsg" style="color:red; margin-top:10px; font-size:12px;"></div>
    </div>
</div>

<div class="container" id="captureArea">
    <div class="header">
        <h2 id="pageTitle"><i class="fas fa-chart-line"></i> สรุปยอดขายรวม</h2>
        <a href="index.html" class="btn-back" data-html2canvas-ignore="true">🏠 กลับหน้าหลัก</a>
    </div>

    <div class="filters" data-html2canvas-ignore="true">
        <select id="shopFilter" onchange="renderAll()">
            <option value="all">🏢 ดูรวมทุกสาขา</option>
            <option value="ls">📘 เฉพาะ LS แหลมฉบัง</option>
            <option value="sk">🩷 เฉพาะ SK สมาร์ทคิดส์</option>
            <option value="sb">🟧 เฉพาะ SB สคูลบัส</option>
        </select>
        <input type="month" id="monthPicker" onchange="loadData()">
        <button class="btn-load" onclick="loadData()">🔄 โหลดข้อมูล</button>
    </div>

    <div class="grand-box">
        <div style="font-size:14px; opacity:0.8;">ยอดขายสุทธิ (ตามตัวกรองที่เลือก)</div>
        <div style="font-size:40px; font-weight:800;" id="main-grand">0</div>
    </div>

    <div class="audit-card" id="auditCard" style="display:none;">
        <div style="font-weight:bold; margin-bottom:10px; display:flex; align-items:center; gap:5px;">
            <i class="fas fa-exclamation-circle" style="color:var(--neg)"></i> รายการยอดเงินไม่ตรง (Missing/Over)
        </div>
        <div class="audit-list" id="auditList"></div>
    </div>

    <div class="dash-grid">
        <div class="card c-ls" id="card-ls">
            <div class="card-head"><span>LS แหลมฉบัง</span></div>
            <div class="card-body">
                <div class="stat-row"><span>POS:</span><span class="stat-val" id="ls-pos">0</span></div>
                <div class="stat-row"><span>เงินสด:</span><span class="stat-val" id="ls-real">0</span></div>
                <div class="stat-row"><span>ผลต่าง:</span><span class="stat-val" id="ls-diff">0</span></div>
            </div>
        </div>
        <div class="card c-sk" id="card-sk">
            <div class="card-head"><span>SK สมาร์ทคิดส์</span></div>
            <div class="card-body">
                <div class="stat-row"><span>POS:</span><span class="stat-val" id="sk-pos">0</span></div>
                <div class="stat-row"><span>เงินสด:</span><span class="stat-val" id="sk-real">0</span></div>
                <div class="stat-row"><span>ผลต่าง:</span><span class="stat-val" id="sk-diff">0</span></div>
            </div>
        </div>
        <div class="card c-sb" id="card-sb">
            <div class="card-head"><span>SB สคูลบัส</span></div>
            <div class="card-body">
                <div class="stat-row"><span>POS:</span><span class="stat-val" id="sb-pos">0</span></div>
                <div class="stat-row"><span>เงินสด:</span><span class="stat-val" id="sb-real">0</span></div>
                <div class="stat-row"><span>ผลต่าง:</span><span class="stat-val" id="sb-diff">0</span></div>
            </div>
        </div>
    </div>

    <div class="table-card">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>วันที่</th>
                    <th>สาขา</th>
                    <th>พนักงาน</th>
                    <th style="text-align:right;">ยอดจริง</th>
                    <th style="text-align:right;">ผลต่าง</th>
                </tr>
            </thead>
            <tbody id="tbBody"></tbody>
        </table>
    </div>
</div>

<button class="btn-img-save" onclick="saveAsImage()" data-html2canvas-ignore="true">
    <i class="fas fa-image"></i> บันทึกเป็นรูปภาพ
</button>

<script>
    const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwr66FOie1ejWpJ83pVdUQZ24PbUmDrDkMjo8zVjyRDURX0Uw-FpOIodZgd2YuV5Tf7_w/exec';

    function checkPass() {
        if(document.getElementById('passInput').value === '4610') {
            document.getElementById('loginOverlay').style.display = 'none';
            loadData();
        } else {
            document.getElementById('loginMsg').innerText = 'รหัสผ่านไม่ถูกต้อง';
            document.getElementById('passInput').value = '';
        }
    }

    const now = new Date();
    document.getElementById('monthPicker').value = now.toISOString().slice(0, 7);

    let rawData = [];

    async function loadData() {
        const month = document.getElementById('monthPicker').value;
        const btn = document.querySelector('.btn-load');
        btn.innerHTML = '⏳..'; btn.disabled = true;

        try {
            const [ls, sk, sb] = await Promise.all([
                fetchData('ใบส่งเงิน LS', month),
                fetchData('ใบส่งเงิน SK', month),
                fetchData('ใบส่งเงิน SB', month)
            ]);

            if(ls) ls.forEach(r => r._src = 'ls');
            if(sk) sk.forEach(r => r._src = 'sk');
            if(sb) sb.forEach(r => r._src = 'sb');

            rawData = [...(ls||[]), ...(sk||[]), ...(sb||[])];
            rawData.sort((a,b) => new Date(b.date) - new Date(a.date));
            renderAll();
        } catch(e) { alert("โหลดข้อมูลไม่สำเร็จ"); }
        btn.innerHTML = '🔄 โหลดข้อมูล'; btn.disabled = false;
    }

    function renderAll() {
        const filter = document.getElementById('shopFilter').value;
        let filtered = (filter === 'all') ? rawData : rawData.filter(r => r._src === filter);

        document.getElementById('card-ls').style.display = (filter==='all'||filter==='ls') ? 'flex' : 'none';
        document.getElementById('card-sk').style.display = (filter==='all'||filter==='sk') ? 'flex' : 'none';
        document.getElementById('card-sb').style.display = (filter==='all'||filter==='sb') ? 'flex' : 'none';

        calcSum('ls', rawData.filter(r => r._src === 'ls'));
        calcSum('sk', rawData.filter(r => r._src === 'sk'));
        calcSum('sb', rawData.filter(r => r._src === 'sb'));

        const total = filtered.reduce((sum, r) => sum + parseFloat(r.actual || 0), 0);
        document.getElementById('main-grand').innerText = "฿ " + fmt(total);

        const tb = document.getElementById('tbBody');
        tb.innerHTML = filtered.length ? '' : '<tr><td colspan="5" style="text-align:center; padding:20px;">ไม่พบข้อมูล</td></tr>';
        
        filtered.forEach(r => {
            let badge = `<span class="badge b-${r._src}">${r._src.toUpperCase()}</span>`;
            let diff = parseFloat(r.diff||0);
            let diffStyle = Math.abs(diff) < 1 ? 'color:#28a745' : 'color:#dc3545; font-weight:bold;';
            tb.innerHTML += `<tr><td>${formatDate(r.date)}</td><td>${badge}</td><td>${r.staff}</td><td style="text-align:right;">${fmt(r.actual)}</td><td style="text-align:right; ${diffStyle}">${fmt(diff)}</td></tr>`;
        });

        const auditList = document.getElementById('auditList');
        auditList.innerHTML = '';
        let problemCount = 0;
        filtered.forEach(r => {
            let diff = parseFloat(r.diff || 0);
            if(Math.abs(diff) > 1) {
                problemCount++;
                let cls = diff < 0 ? 'audit-bad' : 'audit-good';
                auditList.innerHTML += `<div class="audit-item"><span>${formatDate(r.date)} <b>${r._src.toUpperCase()}</b> (${r.staff})</span><span class="${cls}">${diff > 0 ? '+' : ''}${fmt(diff)}</span></div>`;
            }
        });
        document.getElementById('auditCard').style.display = problemCount > 0 ? 'block' : 'none';
    }

    async function fetchData(shop, month) {
        const url = `${CLOUD_URL}?mode=summary&shop=${encodeURIComponent(shop)}&month=${month}&t=${Date.now()}`;
        const res = await fetch(url);
        const json = await res.json();
        return Array.isArray(json) ? json : [];
    }

    function calcSum(prefix, data) {
        let pos=0, real=0, diff=0;
        data.forEach(r => {
            pos += parseFloat(r.pos || 0);
            real += parseFloat(r.actual || 0);
            diff += parseFloat(r.diff || 0);
        });
        document.getElementById(`${prefix}-pos`).innerText = fmt(pos);
        document.getElementById(`${prefix}-real`).innerText = fmt(real);
        document.getElementById(`${prefix}-diff`).innerText = fmt(diff);
    }

    function fmt(n) { return parseFloat(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}); }
    function formatDate(d) { return new Date(d).toLocaleDateString('th-TH', {day:'numeric', month:'short'}); }

    // --- 📸 Save As Image Logic ---
    function saveAsImage() {
        const btn = document.querySelector('.btn-img-save');
        const month = document.getElementById('monthPicker').value;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังสร้างรูป...';
        btn.disabled = true;

        html2canvas(document.getElementById('captureArea'), { 
            scale: 2,
            backgroundColor: "#f4f6f9" 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `สรุปยอดขาย_${month}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            btn.innerHTML = '<i class="fas fa-image"></i> บันทึกเป็นรูปภาพ';
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
