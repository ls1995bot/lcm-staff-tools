<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard สรุปยอดขายรวม</title>
    <link rel="icon" href="logo-ls.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { 
            --bg: #f4f6f9; 
            --ls: #023f88; --ls-light: #e6f0ff;
            --sk: #ff0588; --sk-light: #fff0f6;
            --sb: #e67e22; --sb-light: #fff5eb;
        }
        body { font-family: 'Sarabun', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: var(--bg); }
        
        /* Header & Controls */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header h1 { margin: 0; font-size: 1.4rem; color: #2c3e50; }
        
        .controls-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        input[type="month"], input[type="date"] { padding: 6px; border-radius: 6px; border: 1px solid #ccc; font-family: 'Sarabun'; font-size: 0.9rem; }
        
        .filter-label { font-size: 0.85rem; font-weight: bold; color: #666; margin-right: -3px; }

        .btn-home {
            text-decoration: none; background: #6c757d; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px;
        }
        
        /* Buttons */
        .btn-action {
            border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-family: 'Sarabun'; color: white;
        }
        .btn-print { background: #34495e; }
        .btn-share { background: #06c755; }
        .btn-share-daily { background: #8e44ad; }

        /* Summary Cards (Compact Design) */
        .summary-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* บังคับ 3 คอลัมน์เสมอ */
            gap: 10px; 
            margin-bottom: 20px; 
        }
        .card { 
            background: white; border-radius: 8px; padding: 10px 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #ccc; 
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center;
        }
        .card h3 { margin: 0; font-size: 0.9rem; opacity: 0.8; white-space: nowrap; }
        .card .amount { font-size: 1.4rem; font-weight: 800; margin: 2px 0; line-height: 1.2; }
        .card .diff-sum { font-size: 0.8rem; font-weight: 600; color: #666; }
        .card-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 2rem; opacity: 0.1; }

        .c-ls { border-color: var(--ls); } .c-ls .amount { color: var(--ls); }
        .c-sk { border-color: var(--sk); } .c-sk .amount { color: var(--sk); }
        .c-sb { border-color: var(--sb); } .c-sb .amount { color: var(--sb); }

        /* Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { 
            padding: 8px 15px; border: none; background: #ddd; border-radius: 20px; cursor: pointer; font-family: 'Sarabun'; font-weight: bold; white-space: nowrap; flex: 1;
            transition: 0.2s; font-size: 0.9rem;
        }
        .tab-btn.active { background: #333; color: white; }
        .tab-btn.t-ls.active { background: var(--ls); }
        .tab-btn.t-sk.active { background: var(--sk); }
        .tab-btn.t-sb.active { background: var(--sb); }

        /* Data Table */
        .data-table-container { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: none; margin-bottom: 15px;}
        .data-table-container.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { background: #f8f9fa; padding: 8px; text-align: left; font-weight: 600; color: #666; border-bottom: 2px solid #eee; }
        td { padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        
        .badge { padding: 2px 6px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; }
        .bg-ok { background: #d1e7dd; color: #0f5132; }
        .bg-err { background: #f8d7da; color: #842029; }
        .bg-warn { background: #fff3cd; color: #664d03; }

        .loading { text-align: center; padding: 30px; font-size: 1rem; color: #999; }

        /* CSS for Snapshot/Print Mode */
        .force-show-all .data-table-container { 
            display: block !important; 
            margin-bottom: 15px; 
            border: 1px solid #e0e0e0;
        }
        .force-show-all .data-table-container::before {
            content: attr(data-label);
            display: block; padding: 8px 12px;
            background: #f1f3f5; font-weight: bold; color: #495057;
            border-bottom: 1px solid #e0e0e0; font-size: 0.9rem;
        }

        @media print {
            .no-print, .btn-home, .tabs, .controls-group { display: none !important; }
            body { background: white; -webkit-print-color-adjust: exact; padding: 0; }
            .container { padding: 0; max-width: 100%; }
            .data-table-container { display: block !important; break-inside: avoid; border: 1px solid #ccc; margin-bottom: 10px; }
            .summary-grid { gap: 5px; margin-bottom: 15px; }
            .card { border: 1px solid #ccc; padding: 5px 10px; box-shadow: none; }
            .card .amount { font-size: 1.2rem; }
        }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 1.2rem; width: 100%; }
            .summary-grid { grid-template-columns: 1fr; } /* มือถือเรียงลงมา */
            .controls-group { justify-content: flex-start; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="captureArea">
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <a href="index.html" class="btn-home no-capture"><i class="fas fa-arrow-left"></i> กลับ</a>
            <h1>📊 สรุปยอดขายรวม <span id="displayMode" style="font-size: 0.8rem; color: #666; font-weight:normal;"></span></h1>
        </div>
        
        <div class="controls-group no-capture">
            <span class="filter-label">เดือน:</span>
            <input type="month" id="monthPicker" onchange="loadDashboard()">
            <span class="filter-label">วันที่:</span>
            <input type="date" id="datePicker" onchange="applyDailyFilter()">
            
            <button class="btn-action btn-share" onclick="shareImage()"><i class="fas fa-share-alt"></i> แชร์รูป</button>
            <button class="btn-action btn-share-daily" onclick="shareDailyAllImage()"><i class="fas fa-camera-retro"></i> รายวันรวม</button>
            <button class="btn-action btn-print" onclick="window.print()"><i class="fas fa-print"></i> พิมพ์</button>
        </div>
    </div>

    <div class="summary-grid">
        <div class="card c-ls">
            <i class="fas fa-store card-icon"></i>
            <h3>แหลมฉบัง (LS)</h3>
            <div class="amount" id="sum-ls">0.00</div>
            <div class="diff-sum">ผลต่าง: <span id="diff-ls">0.00</span></div>
        </div>
        <div class="card c-sk">
            <i class="fas fa-heart card-icon"></i>
            <h3>สมาร์ทคิดส์ (SK)</h3>
            <div class="amount" id="sum-sk">0.00</div>
            <div class="diff-sum">ผลต่าง: <span id="diff-sk">0.00</span></div>
        </div>
        <div class="card c-sb">
            <i class="fas fa-bus card-icon"></i>
            <h3>สคูลบัส (SB)</h3>
            <div class="amount" id="sum-sb">0.00</div>
            <div class="diff-sum">ผลต่าง: <span id="diff-sb">0.00</span></div>
        </div>
    </div>

    <div class="tabs no-capture">
        <button class="tab-btn t-ls active" onclick="showTab('ls')">🔵 LS</button>
        <button class="tab-btn t-sk" onclick="showTab('sk')">💖 SK</button>
        <button class="tab-btn t-sb" onclick="showTab('sb')">🟠 SB</button>
    </div>

    <div id="tab-ls" class="data-table-container active" data-label="🔵 แหลมฉบัง (LS)"><div class="loading">กำลังโหลด...</div></div>
    <div id="tab-sk" class="data-table-container" data-label="💖 สมาร์ทคิดส์ (SK)"><div class="loading">กำลังโหลด...</div></div>
    <div id="tab-sb" class="data-table-container" data-label="🟠 สคูลบัส (SB)"><div class="loading">กำลังโหลด...</div></div>
    
    <div style="text-align: center; color: #999; font-size: 0.7rem; margin-top: 15px;">
        ข้อมูล ณ วันที่: <span id="printDate"></span>
    </div>

</div>

<script>
    const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwr66FOie1ejWpJ83pVdUQZ24PbUmDrDkMjo8zVjyRDURX0Uw-FpOIodZgd2YuV5Tf7_w/exec';
    
    let storeData = { ls: [], sk: [], sb: [] };

    const now = new Date();
    document.getElementById('monthPicker').value = now.toISOString().slice(0, 7);
    document.getElementById('printDate').innerText = now.toLocaleDateString('th-TH');

    function init() { loadDashboard(); }

    async function loadDashboard() {
        const month = document.getElementById('monthPicker').value;
        if(!month) return;
        
        document.getElementById('datePicker').value = '';
        document.getElementById('displayMode').innerText = `(รายเดือน)`;

        ['ls', 'sk', 'sb'].forEach(shop => {
            document.getElementById(`sum-${shop}`).innerText = '...';
            document.getElementById(`tab-${shop}`).innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> กำลังดึงข้อมูล...</div>';
        });

        await Promise.all([
            fetchData("ใบส่งเงิน LS", "ls", month),
            fetchData("ใบส่งเงิน SK", "sk", month),
            fetchData("ใบส่งเงิน SB", "sb", month)
        ]);
    }

    async function fetchData(shopName, shopId, month) {
        try {
            const url = `${CLOUD_URL}?mode=summary&shop=${encodeURIComponent(shopName)}&month=${month}`;
            const resp = await fetch(url);
            const data = await resp.json();
            storeData[shopId] = data;
            renderShop(shopId, data);
        } catch (e) {
            document.getElementById(`tab-${shopId}`).innerHTML = `<div class="loading" style="color:red">❌ ผิดพลาด</div>`;
        }
    }

    function applyDailyFilter() {
        const selectedDate = document.getElementById('datePicker').value;
        
        if (!selectedDate) {
            document.getElementById('displayMode').innerText = `(รายเดือน)`;
            renderShop('ls', storeData.ls);
            renderShop('sk', storeData.sk);
            renderShop('sb', storeData.sb);
            return;
        }

        const d = new Date(selectedDate);
        document.getElementById('displayMode').innerText = `(วันที่ ${d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'})})`;

        ['ls', 'sk', 'sb'].forEach(id => {
            const filtered = storeData[id].filter(row => {
                const rowDate = new Date(row.date).toISOString().split('T')[0];
                return rowDate === selectedDate;
            });
            renderShop(id, filtered);
        });
    }

    function renderShop(id, data) {
        let totalSales = 0, totalDiff = 0;
        let html = `<table><thead><tr><th width="15%">วันที่</th><th width="25%">พนักงาน</th><th width="20%" style="text-align:right">POS</th><th width="20%" style="text-align:right">ยอดจริง</th><th width="20%" style="text-align:center">ผลต่าง</th></tr></thead><tbody>`;

        if(data.length === 0) {
            html = '<div class="loading" style="padding: 20px;">📭 ไม่มีข้อมูล</div>';
        } else {
            const sortedData = [...data].sort((a,b) => new Date(b.date) - new Date(a.date));
            sortedData.forEach(row => {
                const dateObj = new Date(row.date);
                const dateStr = dateObj.toLocaleDateString('th-TH', {day: 'numeric', month: 'short'});
                const actual = parseFloat(row.actual) || 0;
                const pos = parseFloat(row.pos) || 0;
                const diff = parseFloat(row.diff) || 0;

                totalSales += actual; 
                totalDiff += diff;

                let badgeClass = 'bg-ok', diffText = '0.00';
                if(diff < -1) { badgeClass = 'bg-err'; diffText = diff.toLocaleString(); }
                else if(diff > 1) { badgeClass = 'bg-warn'; diffText = '+' + diff.toLocaleString(); }

                html += `<tr>
                    <td>${dateStr}</td>
                    <td>${row.staff}</td>
                    <td style="text-align:right">${pos.toLocaleString()}</td>
                    <td style="text-align:right; font-weight:bold;">${actual.toLocaleString()}</td>
                    <td style="text-align:center"><span class="badge ${badgeClass}">${diffText}</span></td>
                </tr>`;
            });
            html += '</tbody></table>';
        }

        document.getElementById(`sum-${id}`).innerText = totalSales.toLocaleString('en-US', {minimumFractionDigits:2});
        const diffEl = document.getElementById(`diff-${id}`);
        diffEl.innerText = totalDiff.toLocaleString('en-US', {minimumFractionDigits:2});
        diffEl.style.color = totalDiff < 0 ? 'red' : (totalDiff > 0 ? '#e67e22' : 'green');
        document.getElementById(`tab-${id}`).innerHTML = html;
    }

    function showTab(id) {
        document.querySelectorAll('.data-table-container').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${id}`).classList.add('active');
        document.querySelector(`.t-${id}`).classList.add('active');
    }

    // --- ฟังก์ชันแคปหน้าจอปกติ ---
    async function shareImage() {
        const btn = document.querySelector('.btn-share');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> สร้างรูป...';
        
        const toHide = document.querySelectorAll('.no-capture');
        toHide.forEach(el => el.style.display = 'none');

        try {
            const canvas = await html2canvas(document.querySelector("#captureArea"), {
                scale: 2, useCORS: true, backgroundColor: "#f4f6f9"
            });
            processCanvas(canvas, "dashboard_summary.png", btn, originalText, toHide);
        } catch (err) {
            handleCaptureError(err, btn, originalText, toHide);
        }
    }

    // --- ฟังก์ชันใหม่: แคปหน้าจอรวดเดียว 3 สาขา ---
    async function shareDailyAllImage() {
        const datePicker = document.getElementById('datePicker');
        if (!datePicker.value) {
            alert("กรุณาเลือก 'วันที่' ที่ต้องการแชร์ก่อนครับ");
            return;
        }

        const btn = document.querySelector('.btn-share-daily');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังรวมร่าง...';

        const captureArea = document.querySelector("#captureArea");
        const toHide = document.querySelectorAll('.no-capture');
        const headerTitle = document.querySelector('.header h1');
        const originalTitleText = headerTitle.innerHTML;

        toHide.forEach(el => el.style.display = 'none'); 
        captureArea.classList.add('force-show-all'); 

        const dateStr = new Date(datePicker.value).toLocaleDateString('th-TH', {day:'numeric', month:'long', year:'numeric'});
        headerTitle.innerHTML = `📊 สรุปยอดขาย 3 สาขา (ประจำวันที่ ${dateStr})`;

        try {
            await new Promise(resolve => setTimeout(resolve, 200));
            const canvas = await html2canvas(captureArea, {
                scale: 2, useCORS: true, backgroundColor: "#f4f6f9"
            });
            
            captureArea.classList.remove('force-show-all');
            headerTitle.innerHTML = originalTitleText;
            processCanvas(canvas, `daily_summary_all_${datePicker.value}.png`, btn, originalText, toHide);

        } catch (err) {
            captureArea.classList.remove('force-show-all');
            headerTitle.innerHTML = originalTitleText;
            handleCaptureError(err, btn, originalText, toHide);
        }
    }

    function processCanvas(canvas, filename, btn, originalText, toHide) {
        canvas.toBlob(async (blob) => {
            const file = new File([blob], filename, { type: "image/png" });
            if (navigator.share && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'สรุปยอดขาย', text: 'สรุปยอดขาย' });
                } catch (err) { console.log('Share canceled'); }
            } else {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                alert("⬇️ ดาวน์โหลดรูปภาพเรียบร้อย");
            }
            toHide.forEach(el => el.style.display = '');
            btn.innerHTML = originalText;
        }, 'image/png');
    }

    function handleCaptureError(err, btn, originalText, toHide) {
        alert("❌ สร้างรูปภาพล้มเหลว: " + err.message);
        toHide.forEach(el => el.style.display = '');
        btn.innerHTML = originalText;
    }

    init();
</script>

</body>
</html>
