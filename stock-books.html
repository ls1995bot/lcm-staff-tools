<!DOCTYPE html>
<html lang="th">

    <style>
        :root { --primary: #023f88; --wanna: #e91e63; --aksara: #2e7d32; --bg: #f4f6f9; }
        
        /* ตั้งค่าหน้ากระดาษ */
        @page { 
            size: A4 portrait; 
            margin: 10mm; /* ให้ Printer จัดการขอบเอง */
        }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 0; 
            background: var(--bg); 
            color: #000;
            display: flex;
            height: 100vh;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* --- Toolbar (Left) --- */
        #control-panel {
            width: 320px; padding: 20px; background: white; border-right: 1px solid #ccc;
            display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0;
        }
        .shop-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .shop-header img { width: 45px; border-radius: 50%; }
        .shop-header h2 { font-size: 18px; margin: 0; color: var(--primary); }
        
        .selector-box { border: 1px solid #ddd; border-radius: 6px; padding: 10px; background: #fff; }
        .selector-title { font-weight: bold; margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 4px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 2px; }
        .checkbox-item:hover { background: #f0f7ff; }
        .checkbox-item input { transform: scale(1.3); }

        .btn { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; font-size: 14px; margin-top: 5px; font-family: 'Sarabun'; }
        .btn-gen { background: #28a745; color: white; }
        .btn-print { background: var(--primary); color: white; }
        .btn-back { background: #6c757d; color: white; text-decoration: none; display: block; box-sizing: border-box; }

        /* --- Preview Area (Right) --- */
        #preview-area { flex-grow: 1; padding: 20px; overflow: auto; display: flex; justify-content: center; background: #555; }
        
        /* A4 Container ในหน้าจอ */
        .a4-page {
            background: white; width: 210mm; min-height: 297mm; 
            padding: 10mm 15mm; /* ขอบซ้ายขวาเผื่อเย็บเล่มนิดนึง */
            box-sizing: border-box; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            margin-bottom: 20px; position: relative;
        }

        /* --- Document Header --- */
        .doc-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 10px;
        }
        .doc-title { font-size: 24px; font-weight: 800; color: #000; }
        .doc-info { font-size: 14px; font-weight: bold; text-align: right; line-height: 1.8; }
        .doc-line { border-bottom: 1px dotted #000; display: inline-block; width: 120px; text-align: center; }

        /* --- Content Layout --- */
        
        /* หัวข้อสีๆ (Main Group) */
        .main-header { 
            font-size: 16px; font-weight: 800; color: white; padding: 6px 10px; 
            margin-top: 15px; margin-bottom: 5px; border-radius: 4px; 
            page-break-after: avoid; /* ห้ามตัดหน้าหลังหัวข้อนี้ */
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important;
        }
        .bg-wanna { background-color: var(--wanna); }
        .bg-aksara { background-color: var(--aksara); }

        /* กล่องหมวดหมู่ย่อย */
        .category-block { 
            margin-bottom: 15px; 
            page-break-inside: auto; /* ยอมให้ตัดครึ่งกล่องได้ */
        }

        .sub-header {
            background: #eee; font-weight: bold; padding: 5px 8px; font-size: 13px;
            border-left: 5px solid #666; margin-bottom: 0;
            page-break-after: avoid; /* ห้ามตัดหน้าหลังหัวข้อย่อย */
            -webkit-print-color-adjust: exact !important;
        }

        /* ตาราง */
        .stock-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
        
        .stock-table thead { display: table-header-group; } /* หัวตารางซ้ำหน้าถัดไป */
        .stock-table tfoot { display: table-footer-group; }
        .stock-table tr { page-break-inside: avoid; } /* ห้ามตัดครึ่งบรรทัด */

        .stock-table th { 
            border: 1px solid #000; padding: 4px; text-align: center; 
            background: #f0f0f0; font-weight: bold;
        }
        .stock-table td { 
            border: 1px solid #ccc; padding: 2px; vertical-align: middle; height: 18px;
        }
        .stock-table tr:nth-child(even) { background-color: #fcfcfc; }
        
        .col-code { width: 90px; font-family: monospace; color: #444; font-weight: bold; }
        .col-name { font-weight: 600; }
        .col-input { width: 60px; text-align: center; border-left: 1px solid #999; border-right: 1px solid #999; }
        .col-total { width: 60px; text-align: center; background-color: #f5f5f5; font-weight: bold; border: 1px solid #999; }
        
        .input-box { width: 100%; height: 100%; border: none; text-align: center; font-size: 12px; font-weight: bold; color: var(--primary); background: transparent; }

        @media print {
            body { display: block; background: white; padding: 0; }
            #control-panel { display: none !important; }
            #preview-area { padding: 0; background: white; overflow: visible; display: block; }
            
            /* ปลดล็อกความสูงตอนพิมพ์ ให้ไหลตามเนื้อหา */
            .a4-page { 
                box-shadow: none; margin: 0; width: 100%; 
                min-height: 0; height: auto; 
                padding: 0; border: none;
            }
            
            input { border: none !important; }
            
            /* บังคับให้ browser พิมพ์พื้นหลังสี */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>

    function generateSheet() {
        const checkboxes = document.querySelectorAll('input[name="cat"]:checked');
        const container = document.getElementById('sheet-content');
        container.innerHTML = '';

        if (checkboxes.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#999; padding:50px; font-size:16px;">กรุณาติ๊กเลือกหมวดหมู่ที่ต้องการ</div>';
            return;
        }

        let currentGroup = "";
        
        checkboxes.forEach(chk => {
            const key = chk.value;
            const data = db[key];
            if (data) {
                // Check if group changes to add a Main Header
                if (data.group !== currentGroup) {
                    const headerClass = data.group === "Wanna" ? "bg-wanna" : "bg-aksara";
                    const groupTitle = data.group === "Wanna" ? "เครือวรรณาบุ๊คส์ (ลิขสิทธิ์)" : "เครืออักษรา / กาญจนา";
                    container.insertAdjacentHTML('beforeend', `<div class="main-header ${headerClass}"><span>${groupTitle}</span></div>`);
                    currentGroup = data.group;
                }
                renderBlock(data, container);
            }
        });
    }

    function renderBlock(data, container) {
        let rowsHtml = '';
        data.items.forEach(item => {
            rowsHtml += `
                <tr>
                    <td class="col-code">${item.c}</td>
                    <td class="col-name">${item.n}</td>
                    <td class="col-input"><input class="input-box" type="text"></td>
                    <td class="col-input"><input class="input-box" type="text"></td>
                    <td class="col-total"><input class="input-box" type="text"></td>
                </tr>
            `;
        });

        const html = `
            <div class="category-block">
                <div class="sub-header">${data.title}</div>
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th style="width:20%">บาร์โค้ด</th>
                            <th style="width:50%">ชื่อสินค้า</th>
                            <th style="width:10%">หน้าร้าน</th>
                            <th style="width:10%">สโตร์</th>
                            <th style="width:10%">รวม</th>
                        </tr>
                    </thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    }
    
    // Auto-generate on load
    generateSheet();
</script>
